repos:
  - repo: local
    hooks:
      - id: commitlint
        name: Commit Lint
        entry: commitlint lint --message
        stages: [commit-msg]
        language: system
        description: "Commit Lint to Conventional Commits pattern"
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        stages: [pre-commit]
        language: system
        pass_filenames: false
      - id: go-fmt
        name: go fmt
        entry: go fmt
        types: [go]
        exclude: "(^|/)vendor/"
        stages: [pre-commit]
        language: system
        pass_filenames: false
      - id: govulncheck
        name: govulncheck
        entry: govulncheck
        files: ^go\.mod$|^go\.sum$
        stages: [pre-commit]
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        types: [go]
        stages: [pre-commit]
        language: system
        pass_filenames: false

  # - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
  #   rev: v9.22.0
  #   hooks:
  #     - id: commitlint
  #       stages: [commit-msg]
  #       additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

